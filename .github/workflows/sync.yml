name: Sync fork with upstream

on:
  schedule:
    - cron: '0 3 * * *'   # ogni giorno alle 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream
        run: |
          git remote add upstream https://github.com/Nicolas-Radomski/GenomicBasedClassification.git
          git fetch upstream

      - name: Create sync branch
        run: |
          git checkout -B sync-upstream upstream/main

      - name: Push sync branch
        run: |
          git push origin sync-upstream --force

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: sync-upstream
          title: "Sync from upstream"
          body: |
            Automated sync from:
            https://github.com/Nicolas-Radomski/GenomicBasedClassification
          base: main
